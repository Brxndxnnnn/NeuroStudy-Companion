# compose.yaml  ← Docker Compose now prefers this name over docker-compose.yml
services:

  db:
    image: timescale/timescaledb:latest-pg17
    container_name: neurostudy_db
    env_file: ./db/.env.docker
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      # Bound to LOOPBACK ONLY, in every environment. "5433:5432" binds 0.0.0.0 and
      # publishes Postgres to the whole internet — on the droplet that is the database
      # itself, reachable by anyone who scans the port. Reach it from outside over an
      # SSH tunnel instead:
      #     ssh -N -L 5433:localhost:5433 root@139.59.126.77
      # (5432 is left free for a local psql install.)
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurostudy_user -d neurostudy"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - neurostudy

  backend:
      build:
        context: ./backend
        dockerfile: Dockerfile
      container_name: neurostudy_backend
      env_file: ./backend/.env.docker
      depends_on:
        db:
          condition: service_healthy
      expose:
        - "3000"   # ← only nginx faces the outside
      networks:
        - neurostudy

  ml:
      build:
        context: ./ml_service
        dockerfile: Dockerfile
      container_name: neurostudy_ml
      env_file: ./ml_service/.env.docker
      restart: unless-stopped
      depends_on:
        db:
          condition: service_healthy
      expose:
        - "8000"   # ← only nginx faces the outside
      networks:
        - neurostudy
  
  frontend:
      build:
        context: ./frontend
        dockerfile: Dockerfile
      container_name: neurostudy_frontend
      restart: unless-stopped
      env_file: ./frontend/.env.docker
      depends_on:
        - backend
        - ml
      expose:
        - "3000"   # ← only nginx faces the outside
      networks:
        - neurostudy

  nginx:
    image: nginx:alpine
    container_name: neurostudy_nginx
    restart: unless-stopped
    ports:
      - "8090:80"       # ← only nginx faces the outside
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - ml
volumes:
  postgres-data:
networks:
  neurostudy:
   driver: bridge