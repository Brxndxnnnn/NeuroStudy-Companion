# compose.yaml  ← Docker Compose now prefers this name over docker-compose.yml
services:

  db:
    image: timescale/timescaledb:latest-pg17
    container_name: neurostudy_db
    env_file: ./db/.env.docker
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
      - ./db/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./db/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    ports:
      # Bound to LOOPBACK ONLY, in every environment. "5433:5432" binds 0.0.0.0 and
      # publishes Postgres to the whole internet — on the droplet that is the database
      # itself, reachable by anyone who scans the port. Reach it from outside over an
      # SSH tunnel instead:
      #     ssh -N -L 5433:localhost:5433 root@139.59.126.77
      # (5432 is left free for a local psql install.)
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurostudy_user -d neurostudy"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - neurostudy

  backend:
      build:
        context: ./backend
        dockerfile: Dockerfile
      container_name: neurostudy_backend
      env_file: ./backend/.env.docker
      depends_on:
        db:
          condition: service_healthy
      expose:
        - "3000"   # ← only nginx faces the outside
      networks:
        - neurostudy

  ml:
      build:
        context: ./ml_service
        dockerfile: Dockerfile
      container_name: neurostudy_ml
      env_file: ./ml_service/.env.docker
      restart: unless-stopped
      depends_on:
        db:
          condition: service_healthy
      expose:
        - "8000"   # ← only nginx faces the outside
      volumes:
        # Trained Phase 1 model artifacts (MODEL_DIR=/app/saved_models). A named
        # volume so a `docker compose up` that recreates the container does not wipe
        # the current model — otherwise ml_models rows would point at files that no
        # longer exist and inference would fail to load them.
        - ml-models:/app/saved_models
      networks:
        - neurostudy

  frontend:
      build:
        context: ./frontend
        dockerfile: Dockerfile
      container_name: neurostudy_frontend
      restart: unless-stopped
      env_file: ./frontend/.env.docker
      depends_on:
        - backend
        - ml
      expose:
        - "3000"   # ← only nginx faces the outside
      networks:
        - neurostudy

  nginx:
    image: nginx:alpine
    container_name: neurostudy_nginx
    restart: unless-stopped
    ports:
      - "8090:80"       # ← only nginx faces the outside
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
      - ml
    networks:
      - neurostudy

  certbot:
    image: certbot/certbot:latest
    container_name: neurostudy_certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    networks:
      - neurostudy
      
volumes:
  postgres-data:
  ml-models:
networks:
  neurostudy:
   driver: bridge