# compose.yaml  ← Docker Compose now prefers this name over docker-compose.yml
services:

  db:
    image: timescale/timescaledb:latest-pg17
    container_name: neurostudy_db
    env_file: ./db/.env.docker
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    ports:
      # Bound to LOOPBACK ONLY, in every environment. "5433:5432" binds 0.0.0.0 and
      # publishes Postgres to the whole internet — on the droplet that is the database
      # itself, reachable by anyone who scans the port. Reach it from outside over an
      # SSH tunnel instead:
      #     ssh -N -L 5433:localhost:5433 root@139.59.126.77
      # (5432 is left free for a local psql install.)
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurostudy_user -d neurostudy"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
      build: ./backend
      container_name: neurostudy_backend
      env_file: ./backend/.env.docker
      depends_on:
        db:
          condition: service_healthy
      volumes:
        - ./backend/src:/app/src
      command: npx nodemon src/index.js   # ← overrides the Dockerfile CMD for dev

  # ── NeuroBridge ─────────────────────────────────────────────────
  # Uncomment when neuuro_bridge/NeuroBridge/Dockerfile is ready
  # Or just put in your own one
  #
  # neuuro_bridge:
  #   build: ./neuuro_bridge/NeuroBridge
  #   container_name: neurostudy_bridge
  #   env_file: ./neuuro_bridge/NeuroBridge/.env
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   # ports:
  #   #   - "XXXX:XXXX"   ← TBC on which port the service exposes

  ml:
      build: ./ml_service
      container_name: neurostudy_ml
      env_file: ./ml_service/.env.docker
      # ports:
      #   - "8000:8000"
      volumes:
        - ./ml_service:/app
      command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      depends_on:
        db:
          condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: neurostudy_nginx
    ports:
      - "8090:80"       # ← only nginx faces the outside
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - ml
    restart: always
volumes:
  postgres-data: