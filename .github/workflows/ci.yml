name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  frontend:
    name: Frontend (lint, build, docker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Builds the actual production image so a broken Dockerfile / build step
      # is caught here instead of on the first real deploy.
      - name: Docker build check
        run: docker build -f Dockerfile -t ci-frontend .

  backend:
    name: Backend (install, docker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Docker build check
        run: docker build -f Dockerfile -t ci-backend .

  ml_service:
    name: ML service (install, docker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml_service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ml_service/requirements.txt

      - run: pip install -r requirements.txt

      # test_features.py and test_preprocessing.py are excluded on purpose:
      # they assert against one specific already-recorded clinical session's
      # real EEG data (conftest.py's db_conn/session_id fixtures), not
      # synthetic input. That's real patient data — it isn't fabricated as a
      # CI fixture, and CI isn't pointed at any database that has it. Every
      # other test file uses synthetic signals or mocks and runs for real
      # here. Dummy DB_* values are only needed because app.core.config
      # raises at import time if they're unset — nothing here connects.
      - name: Run tests
        env:
          DB_USER: ci_dummy
          DB_PASSWORD: ci_dummy
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: ci_dummy
          # Matches the Dockerfile's own PYTHONPATH=/app — "from app.x import
          # y" only resolves with the ml_service root on the path.
          PYTHONPATH: "."
        run: pytest app/tests/ --ignore=app/tests/test_features.py --ignore=app/tests/test_preprocessing.py -v

      - name: Docker build check
        run: docker build -f Dockerfile -t ci-ml .
