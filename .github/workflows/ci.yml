name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  frontend:
    name: Frontend (lint, build, docker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      # Builds the actual production image so a broken Dockerfile / build step
      # is caught here instead of on the first real deploy.
      - name: Docker build check
        run: docker build -f Dockerfile -t ci-frontend .

  backend:
    name: Backend (install, docker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint

      # No test suite exists for the backend yet — that's separate, larger
      # follow-up work (choosing a framework, deciding what to cover), not
      # something to bundle into CI setup.
      - name: Docker build check
        run: docker build -f Dockerfile -t ci-backend .

  ml_service:
    name: ML service (install, docker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml_service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ml_service/requirements.txt

      - run: pip install -r requirements.txt

      # app/tests/ are integration tests that need a live, seeded database
      # (see app/tests/conftest.py) and are not runnable in CI as written, so
      # they are intentionally not invoked here — only dependency install and
      # the image build are verified.
      - name: Docker build check
        run: docker build -f Dockerfile -t ci-ml .
