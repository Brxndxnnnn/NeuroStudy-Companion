name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  frontend:
    name: Frontend (lint, build, docker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Not merge-blocking yet: there are pre-existing lint errors elsewhere in
      # the app (stricter react-hooks rules) unrelated to any given PR. Fixing
      # those is separate follow-up work, not something to bundle into CI setup.
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      - run: npm run build

      # Builds the actual production image so a broken Dockerfile / build step
      # is caught here instead of on the first real deploy.
      - name: Docker build check
        run: docker build -f Dockerfile -t ci-frontend .

  backend:
    name: Backend (install, docker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # No lint config or test suite exists for the backend yet, so there is
      # nothing real to run here beyond dependency install + image build.
      - name: Docker build check
        run: docker build -f Dockerfile -t ci-backend .

  ml_service:
    name: ML service (install, docker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml_service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ml_service/requirements.txt

      - run: pip install -r requirements.txt

      # app/tests/ are integration tests that need a live, seeded database
      # (see app/tests/conftest.py) and are not runnable in CI as written, so
      # they are intentionally not invoked here — only dependency install and
      # the image build are verified.
      - name: Docker build check
        run: docker build -f Dockerfile -t ci-ml .
