# nginx/nginx.conf
events {}

http {
    server tokens off;

    upstream frontend_service {
        server frontend:3000;
    }

    upstream backend_service {
        server backend:3000;
    }

    upstream ml_service {
        server ml:8000;
    }

    server {
        listen 80;
        server_name clinics.axonview.sg;

        client_max_body_size 50m;

        # Certbot challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            try_files $uri =404;
        }

        # Backend API + Swagger
        location /api/ {
            proxy_pass         http://backend_service;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
        }

        location /api-docs {
            proxy_pass         http://backend_service;
            proxy_http_version 1.1;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;

            # Helmet sets these on every backend response, and they break Swagger UI
            # when it is served through the proxy: the CSP blocks its inline scripts,
            # so /api-docs renders as a blank page. Stripped for the docs route only —
            # the API routes above keep every header Helmet sets.
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cross-Origin-Opener-Policy;
            proxy_hide_header Origin-Agent-Cluster;
        }

        # ML service
        location /ml/ {
            proxy_pass         http://ml_service/;
            proxy_http_version 1.1;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Frontend
        location / {
            proxy_pass http://frontend_service;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}