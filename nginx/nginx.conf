# nginx/nginx.conf
events {}

http {
    server {
        listen 80;

        # Backend API + Swagger
        location /api/ {
            proxy_pass         http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /api-docs {
            proxy_pass         http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;

            # Helmet sets these on every backend response, and they break Swagger UI
            # when it is served through the proxy: the CSP blocks its inline scripts,
            # so /api-docs renders as a blank page. Stripped for the docs route only —
            # the API routes above keep every header Helmet sets.
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cross-Origin-Opener-Policy;
            proxy_hide_header Origin-Agent-Cluster;
        }

        # ML service
        location /ml/ {
            proxy_pass         http://ml:8000/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
    }
}