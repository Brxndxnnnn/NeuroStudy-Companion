# nginx/nginx.conf
events {}

http {
    server_tokens off;

    upstream frontend_service {
        server frontend:3000;
    }

    upstream backend_service {
        server backend:3000;
    }

    upstream ml_service {
        server ml:8000;
    }

    server {
        listen 80;
        server_name clinics.axonview.sg;

        # Certbot challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name clinics.axonview.sg;

        ssl_certificate /etc/letsencrypt/live/clinics.axonview.sg/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/clinics.axonview.sg/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        client_max_body_size 50m;

        # Comparing a client with an ML group refits the group's model on the server, which
        # takes up to a minute or two. The default 60 s read timeout would cut it off and
        # the page would report a failure for work that was still running. (Training does
        # not need this: it runs in the background and the page polls.)
        location ~ ^/api/ml/groups/[^/]+/fit$ {
            proxy_pass         http://backend_service;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # Backend API + Swagger
        location /api/ {
            proxy_pass         http://backend_service;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
        }

        location /api-docs {
            proxy_pass         http://backend_service;
            proxy_http_version 1.1;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;

            # Helmet sets these on every backend response, and they break Swagger UI
            # when it is served through the proxy: the CSP blocks its inline scripts,
            # so /api-docs renders as a blank page. Stripped for the docs route only —
            # the API routes above keep every header Helmet sets.
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cross-Origin-Opener-Policy;
            proxy_hide_header Origin-Agent-Cluster;
        }

        # Windows-bridge auto-update feed (Velopack): static release files uploaded to
        # /var/bridge-updates on the droplet host (outside the repo — survives deploys),
        # mounted read-only in compose.prod.yaml. Public read is fine: release binaries
        # only, no secrets (pack.ps1 asserts no .env can ship).
        location /bridge-updates/ {
            alias /var/www/bridge-updates/;
            default_type application/octet-stream;
        }

        # ML service is intentionally NOT exposed here. It has no auth of its own and
        # connects to the DB as a BYPASSRLS role, so it must never be reachable from
        # the internet. All ML calls go through the backend at /api/ml/..., which
        # authenticates and enforces per-clinic row-level security before proxying to
        # ml_service over the internal compose network (the container only `expose`s
        # its port, it is not published).

        # Frontend
        location / {
            proxy_pass http://frontend_service;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}